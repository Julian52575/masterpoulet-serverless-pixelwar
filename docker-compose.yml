# Local frontend stack: a Traefik reverse proxy in front of the React frontend.
# The API is the serverless functions in ./app/functions, deployed by infra/serverless/functions.
#
#   http://localhost:8000/           -> frontend (Vite dev server, ./app/frontend)
#   http://localhost:8080/           -> Traefik dashboard (insecure, local only)

services:
  proxy:
    image: docker.io/library/traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --accesslog=true
    ports:
      - "${PROXY_PORT:-8000}:80"
      - "${PROXY_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro"
    security_opt:
      - label=disable

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dev.Dockerfile
    volumes:
      - ./app/frontend:/app
      - frontend-node-modules:/app/node_modules
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=3000
    # Vite takes a few seconds to listen; without this Traefik answers 502.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  frontend-node-modules:
