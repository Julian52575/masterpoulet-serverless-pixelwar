name: ARC smoke test

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment(s) whose GKE runners to check"
        type: choice
        options: [dev, prod, both]
        default: both
  push:
    branches: [15-feature-self-run-terraform-related-workflows-checks]

permissions: {}

concurrency:
  group: arc-smoke-test-${{ github.ref }}
  cancel-in-progress: false

run-name: "ARC smoke test ${{ inputs.env || 'both' }}"

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.scope.outputs.environments }}
    steps:
      - id: scope
        env:
          ENVIRONMENT: ${{ inputs.env || 'both' }}
        run: |
          case "$ENVIRONMENT" in
            dev) envs='["dev"]' ;;
            prod) envs='["prod"]' ;;
            both) envs='["dev","prod"]' ;;
            *) echo "::error::unknown env $ENVIRONMENT"; exit 1 ;;
          esac
          echo "environments=$envs" >> "$GITHUB_OUTPUT"
          echo "Checking: $envs"

  # A job queued on a label with no runner waits forever, so a watchdog on a hosted runner
  # polls this run's jobs and cancels the run when a smoke job never starts.
  watchdog:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # cancel the run
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.scope.outputs.environments) }}
    name: watchdog (${{ matrix.env }})
    steps:
      - name: Wait for the GKE runner to pick up the job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ENV_NAME: ${{ matrix.env }}
          LABEL: ${{ matrix.env == 'prod' && 'masterpoulet-prod-gke' || 'masterpoulet-dev-gke' }}
          DEADLINE: "120"
        run: |
          set -uo pipefail
          job="smoke-test ($ENV_NAME)"
          echo "Watching '$job' for label $LABEL (deadline ${DEADLINE}s)"
          end=$((SECONDS + DEADLINE))
          while :; do
            row=$(gh run view "$GITHUB_RUN_ID" --json jobs \
              --jq ".jobs[] | select(.name == \"$job\") | [.status, (.conclusion // \"-\"), (.runnerName // \"-\")] | @tsv")
            printf '[%3ss] %s: status/conclusion/runner = %s\n' "$SECONDS" "$job" "${row:-<job not created yet>}"
            status=${row%%$'\t'*}
            if [ "$status" = in_progress ] || [ "$status" = completed ]; then
              echo "::notice::$ENV_NAME: GKE runner picked up the job"
              echo "- **$ENV_NAME**: runner picked up the job (\`$LABEL\`)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [ "$SECONDS" -lt "$end" ] || break
            sleep 5
          done
          echo "::error::$ENV_NAME: no runner for '$LABEL' started the job within ${DEADLINE}s"
          echo "- **$ENV_NAME**: NO runner for \`$LABEL\` within ${DEADLINE}s; run cancelled" >> "$GITHUB_STEP_SUMMARY"
          gh run cancel "$GITHUB_RUN_ID" || true
          exit 1

  smoke-test:
    needs: scope
    runs-on: ${{ matrix.env == 'prod' && 'masterpoulet-prod-gke' || 'masterpoulet-dev-gke' }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.scope.outputs.environments) }}
    name: smoke-test (${{ matrix.env }})
    steps:
      - name: Report runner state
        shell: bash
        env:
          ENV_NAME: ${{ matrix.env }}
        run: |
          set -uo pipefail
          echo "::group::Runner"
          printf 'Environment:     %s\n' "$ENV_NAME"
          printf 'Runner name:     %s\n' "$RUNNER_NAME"
          printf 'Runner OS/arch:  %s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
          printf 'Hostname:        %s\n' "$(hostname)"
          printf 'Kernel:          %s\n' "$(uname -srm)"
          echo "::endgroup::"

          echo "::group::Resources"
          printf 'CPUs: %s\n' "$(nproc)"
          free -h || true
          df -h / || true
          echo "::endgroup::"

          echo "::group::Kubernetes"
          printf 'KUBERNETES_SERVICE_HOST=%s\n' "${KUBERNETES_SERVICE_HOST:-<unset>}"
          echo "::endgroup::"

          {
            echo "### ARC smoke test: $ENV_NAME"
            echo "Runner: \`$RUNNER_NAME\` on \`$(hostname)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          echo "GKE runner OK ($RUNNER_NAME)"
