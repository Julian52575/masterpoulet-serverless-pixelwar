# .github/workflows/terraform-deploy.yml
name: Terraform Deploy
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan only shows changes in the job summary; apply also deploys them"
        type: choice
        options: [plan, apply]
        default: plan
      environment:
        description: "Environment(s) to deploy; both runs dev before prod"
        type: choice
        options: [dev, prod, both]
        default: dev
      allow_destroy:
        description: "Allow apply to delete or replace resources"
        type: boolean
        default: false
      ref:
        description: "Tag, branch or commit SHA to deploy (empty: the branch selected above)"
        type: string
        required: false
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"] # release-please tags, e.g. 1.0.0
permissions:
  contents: read
  id-token: write # needed by the called workflow
run-name: "Terraform ${{ inputs.mode || 'apply' }} ${{ inputs.environment || 'both' }} @ ${{ inputs.ref || github.ref_name }}"
# Serial order: foundation, functions, frontend per environment, dev before prod.
# !cancelled() keeps later legs running after a failure; the env conditions skip unselected ones.
jobs:
  dev-foundation:
    if: ${{ !cancelled() && contains(fromJSON('["dev","both"]'), inputs.environment || 'both') }}
    uses: ./.github/workflows/terraform-root.yml
    secrets: inherit
    with:
      root: foundation
      env: dev
      mode: ${{ inputs.mode || 'apply' }}
      allow_destroy: ${{ inputs.allow_destroy || false }} # tag pushes never destroy
      ref: ${{ inputs.ref || '' }}

  dev-functions:
    needs: dev-foundation
    if: ${{ !cancelled() && contains(fromJSON('["dev","both"]'), inputs.environment || 'both') }}
    uses: ./.github/workflows/terraform-root.yml
    secrets: inherit
    with:
      root: serverless/functions
      env: dev
      mode: ${{ inputs.mode || 'apply' }}
      allow_destroy: ${{ inputs.allow_destroy || false }} # tag pushes never destroy
      ref: ${{ inputs.ref || '' }}
      adopt: true

  dev-frontend:
    needs: dev-functions
    if: ${{ !cancelled() && contains(fromJSON('["dev","both"]'), inputs.environment || 'both') }}
    uses: ./.github/workflows/terraform-root.yml
    secrets: inherit
    with:
      root: frontend
      env: dev
      mode: ${{ inputs.mode || 'apply' }}
      allow_destroy: ${{ inputs.allow_destroy || false }} # tag pushes never destroy
      ref: ${{ inputs.ref || '' }}
      deploy_frontend: true

  prod-foundation:
    needs: dev-frontend
    if: ${{ !cancelled() && contains(fromJSON('["prod","both"]'), inputs.environment || 'both') }}
    uses: ./.github/workflows/terraform-root.yml
    secrets: inherit
    with:
      root: foundation
      env: prod
      mode: ${{ inputs.mode || 'apply' }}
      allow_destroy: ${{ inputs.allow_destroy || false }} # tag pushes never destroy
      ref: ${{ inputs.ref || '' }}

  prod-functions:
    needs: prod-foundation
    if: ${{ !cancelled() && contains(fromJSON('["prod","both"]'), inputs.environment || 'both') }}
    uses: ./.github/workflows/terraform-root.yml
    secrets: inherit
    with:
      root: serverless/functions
      env: prod
      mode: ${{ inputs.mode || 'apply' }}
      allow_destroy: ${{ inputs.allow_destroy || false }} # tag pushes never destroy
      ref: ${{ inputs.ref || '' }}
      adopt: true

  prod-frontend:
    needs: prod-functions
    if: ${{ !cancelled() && contains(fromJSON('["prod","both"]'), inputs.environment || 'both') }}
    uses: ./.github/workflows/terraform-root.yml
    secrets: inherit
    with:
      root: frontend
      env: prod
      mode: ${{ inputs.mode || 'apply' }}
      allow_destroy: ${{ inputs.allow_destroy || false }} # tag pushes never destroy
      ref: ${{ inputs.ref || '' }}
      deploy_frontend: true
