name: Terraform Plan (manual only)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Foundation environment to inspect; never applies"
        type: choice
        options: [dev, prod]
        default: dev
permissions:
  contents: read
  id-token: write
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      TF_ENV: ${{ inputs.environment }}
      TF_DATA_DIR: ${{ runner.temp }}/terraform-foundation-${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/foundation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -lockfile=readonly -backend-config="backends/${TF_ENV}.hcl"
      - run: terraform validate
      - run: terraform plan -input=false -lock-timeout=60s -var-file="${TF_ENV}.tfvars"
