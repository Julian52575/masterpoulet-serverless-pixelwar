# .github/workflows/terraform-deploy.yml
name: Terraform Deploy
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan only shows changes in the job summary; apply also deploys them"
        type: choice
        options: [plan, apply]
        default: plan
      environment:
        description: "Environment(s) to deploy; both runs dev before prod"
        type: choice
        options: [dev, prod, both]
        default: dev
      allow_destroy:
        description: "Allow apply to delete or replace resources"
        type: boolean
        default: false
      ref:
        description: "Tag, branch or commit SHA to deploy (empty: the branch selected above)"
        type: string
        required: false
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"] # release-please tags, e.g. 1.0.0
permissions:
  contents: read
run-name: "Terraform ${{ inputs.mode || 'apply' }} ${{ inputs.environment || 'both' }} @ ${{ inputs.ref || github.ref_name }}"
jobs:
  # Builds the ordered list of (environment, root) legs the deploy job runs.
  legs:
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.build.outputs.legs }}
    steps:
      - id: build
        env:
          # Tag pushes have no inputs and deploy both
          ENVIRONMENT: ${{ inputs.environment || 'both' }}
        run: |
          # Foundation first: functions and frontend depend on it.
          roots=(foundation serverless/functions frontend)
          case "$ENVIRONMENT" in
            both) envs=(dev prod) ;;
            *)    envs=("$ENVIRONMENT") ;;
          esac
          legs=$(for e in "${envs[@]}"; do
            for r in "${roots[@]}"; do
              jq -nc --arg env "$e" --arg root "$r" '{env: $env, root: $root}'
            done
          done | jq -sc .)
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          echo "$legs"

  deploy:
    needs: legs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # One leg at a time, in list order (see the legs job); a failed leg cancels the rest.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.legs.outputs.legs) }}
    name: deploy (${{ matrix.root }}, ${{ matrix.env }})
    permissions:
      contents: read
      id-token: write # workload identity federation
    environment: ${{ matrix.env }} # add required reviewers on prd
    env:
      MODE: ${{ inputs.mode || 'apply' }} # tag pushes always apply
      TF_ENV: ${{ matrix.env }}
      # Terraform ignores TF_VAR_* a root does not declare.
      TF_VAR_discord_client_id: ${{ vars.DISCORD_CLIENT_ID }}
      TF_VAR_app_url: ${{ vars.APP_URL }}
      TF_VAR_discord_public_key: ${{ secrets.DISCORD_PUBLIC_KEY }}
      TF_VAR_discord_oauth_client_secret: ${{ secrets.DISCORD_OAUTH_CLIENT_SECRET }}
      TF_VAR_discord_snapshot_webhook: ${{ secrets.DISCORD_SNAPSHOT_WEBHOOK }}
      TF_VAR_discord_bot_token: ${{ secrets.DISCORD_BOT_TOKEN }}
    defaults:
      run:
        working-directory: infra/${{ matrix.root }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false # keeps plan output clean for the summary
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - run: terraform init -input=false -backend-config="backends/${TF_ENV}.hcl"
      - name: Adopt existing resources
        if: matrix.root == 'serverless/functions'
        run: |
          # Cloud Functions/Firestore may already exist from earlier deploys; adopt them instead of failing with 409.
          project=$(sed -n 's/^project_id *= *"\(.*\)"/\1/p' "${TF_ENV}.tfvars")
          region=$(sed -n 's/^region *= *"\(.*\)"/\1/p' "${TF_ENV}.tfvars")
          number=$(gcloud projects describe "$project" --format='value(projectNumber)')
          adopt() {
            terraform state list | grep -qxF "$1" && return 0
            terraform import -input=false -var-file="${TF_ENV}.tfvars" "$1" "$2" \
              || echo "::notice::$1 not found, apply will create it"
          }
          adopt google_artifact_registry_repository.gcf_artifacts "projects/${project}/locations/${region}/repositories/gcf-artifacts"
          adopt google_storage_bucket.gcf_sources "${project}/gcf-v2-sources-${number}-${region}"
          adopt google_firestore_database.default "projects/${project}/databases/(default)"
      - name: Plan
        env:
          REF: ${{ inputs.ref || github.ref_name }}
          ROOT: ${{ matrix.root }}
        run: |
          terraform plan -input=false -no-color -var-file="${TF_ENV}.tfvars" -out=tfplan
          {
            echo "## Terraform ${MODE}: ${ROOT} (${TF_ENV})"
            echo "Ref \`${REF}\` at \`$(git rev-parse HEAD)\`"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Destroy guard
        env:
          ALLOW_DESTROY: ${{ inputs.allow_destroy || false }} # tag pushes never destroy
          ROOT: ${{ matrix.root }}
        run: |
          # Replacements count too: they delete before or after creating.
          destroyed=$(terraform show -json tfplan \
            | jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | .address')
          [ -z "$destroyed" ] && exit 0
          {
            echo "### Resources to delete or replace (${ROOT})"
            echo '```'
            echo "$destroyed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = apply ] && [ "$ALLOW_DESTROY" != true ]; then
            echo "::error::Plan deletes resources; rerun with allow_destroy to proceed:"
            echo "$destroyed"
            exit 1
          fi
          echo "::warning::Plan deletes resources:"
          echo "$destroyed"
      - name: Apply
        if: env.MODE == 'apply'
        run: terraform apply -input=false -auto-approve tfplan
      - name: Build and deploy frontend
        if: env.MODE == 'apply' && matrix.root == 'frontend'
        working-directory: app/frontend
        run: |
          # Everything comes from the functions state; the web apiKey is not a secret.
          terraform -chdir=../../infra/serverless/functions init -input=false -backend-config="backends/${TF_ENV}.hcl" > /dev/null
          out() { terraform -chdir=../../infra/serverless/functions output -raw "$1"; }
          VITE_API_BASE=$(out api_base_url)
          VITE_FIREBASE_API_KEY=$(out firebase_web_api_key)
          VITE_FIREBASE_APP_ID=$(out firebase_web_app_id)
          VITE_FIREBASE_PROJECT_ID=$(sed -n 's/^project_id *= *"\(.*\)"/\1/p' "../../infra/frontend/${TF_ENV}.tfvars")
          export VITE_API_BASE VITE_FIREBASE_API_KEY VITE_FIREBASE_APP_ID VITE_FIREBASE_PROJECT_ID
          npm ci
          npm run build
          npx --yes firebase-tools@14 deploy --only hosting --project "$VITE_FIREBASE_PROJECT_ID"
