name: ARC smoke test

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Existing ARC scale set to test after deployment approval"
        type: choice
        options: [masterpoulet-dev-gke, masterpoulet-prod-gke]
        default: masterpoulet-dev-gke
      parallel:
        description: "Submit two concurrent jobs to the selected scale set"
        type: boolean
        default: false
  push:
    branches: [feat/terraform-c04-gke]
    paths: [.github/workflows/arc-smoke-test.yml]

permissions: {}

concurrency:
  group: arc-smoke-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke-test:
    strategy:
      matrix:
        slot: ${{ fromJSON(inputs.parallel && '[1,2]' || '[1]') }}
    runs-on: ${{ inputs.runner || 'masterpoulet-dev-gke' }}
    timeout-minutes: 15
    steps:
      - name: Verify the GKE runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          printf 'Runner hostname: %s\n' "$(hostname)"
          printf 'ARC GKE smoke test succeeded on Linux\n'
          sleep 30
