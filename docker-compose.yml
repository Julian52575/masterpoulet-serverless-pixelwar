# App stack: a Traefik reverse proxy in front of a React frontend and an
# Express API backed by Postgres and RabbitMQ.
#
#   http://localhost:8000/           -> frontend (Vite dev server, ./frontend)
#   http://localhost:8000/api/items  -> backend  (Express API, ./backend)
#   http://localhost:8000/ws         -> backend  (WebSocket)
#   http://localhost:8080/           -> Traefik dashboard (insecure, local only)
#   http://localhost:15672/          -> RabbitMQ management UI
#
# Observability, only with `just up -d --profile monitoring` (see docs/observability.md):
#   http://localhost:3001/           -> Grafana (dashboards, logs, traces)
#   http://localhost:9090/           -> Prometheus
#   http://localhost:9093/           -> Alertmanager

services:
  proxy:
    image: docker.io/library/traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --accesslog=true
      - --accesslog.format=json
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus.entrypoint=metrics
      # Traefik starts the trace, so it spans the whole request including routing.
      - --tracing.otlp.http.endpoint=http://alloy:4318/v1/traces
      - --tracing.serviceName=proxy
    ports:
      - "${PROXY_PORT:-8000}:80"
      - "${PROXY_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro"

  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - app-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 1s
      timeout: 1s
      retries: 10
      start_period: 1s

  rabbitmq:
    image: rabbitmq:4-management
    # RabbitMQ names its node, and its data directory, after the hostname; a fixed one lets the
    # volume survive container recreation instead of starting a fresh node each time.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    user: rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq:U
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 1s
      timeout: 2s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dev.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}?schema=public
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RATE_LIMIT: ${RATE_LIMIT:-20}
      ADMIN_USERS: ${ADMIN_USERS:-}
      OTEL_SERVICE_NAME: backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    labels:
      - traefik.enable=true

      # Remove /api before sending the request to Express
      - traefik.http.middlewares.backend-stripprefix.stripprefix.prefixes=/api

      - traefik.http.routers.websocket.rule=Path(`/ws`)
      - traefik.http.routers.websocket.priority=20
      - traefik.http.routers.websocket.service=backend

      - traefik.http.routers.backend.rule=PathPrefix(`/api`)
      - traefik.http.routers.backend.priority=10
      - traefik.http.routers.backend.middlewares=backend-stripprefix
      - traefik.http.routers.backend.service=backend
      - traefik.http.services.backend.loadbalancer.server.port=3000
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 1s
      timeout: 1s
      retries: 20
      start_period: 1s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dev.Dockerfile
    environment:
      VITE_BACKEND_URL: http://backend:3000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=3000
    restart: unless-stopped

  # ---- Observability -------------------------------------------------------
  # Same tools and configuration as the Kubernetes deployment (charts/pixelwar/files holds
  # the shared alert rules and dashboard). Ports bind to localhost: none of these have auth.
  # Opt-in `monitoring` profile keeps the everyday dev stack small; without it the backend
  # and Traefik still emit telemetry, which is simply not collected.

  prometheus:
    profiles: [monitoring]
    image: quay.io/prometheus/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      # Tempo's metrics generator pushes service-graph metrics here.
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./charts/pixelwar/files/alerts:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  alertmanager:
    profiles: [monitoring]
    image: quay.io/prometheus/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./observability/compose/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  # Stand-in notification channel: prints each Alertmanager webhook call to its log.
  alert-sink:
    profiles: [monitoring]
    image: docker.io/mendhak/http-https-echo:42
    environment:
      HTTP_PORT: 8080
      LOG_IGNORE_PATH: /health
    restart: unless-stopped

  node-exporter:
    profiles: [monitoring]
    image: quay.io/prometheus/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  loki:
    profiles: [monitoring]
    image: docker.io/grafana/loki:3.6.16
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./observability/compose/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  tempo:
    profiles: [monitoring]
    image: docker.io/grafana/tempo:2.9.0
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./observability/compose/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  alloy:
    profiles: [monitoring]
    image: docker.io/grafana/alloy:v1.21.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/compose/alloy.alloy:/etc/alloy/config.alloy:ro
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro"
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
      - tempo
    restart: unless-stopped

  grafana:
    profiles: [monitoring]
    image: docker.io/grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pixelwar.json
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./observability/compose/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./charts/pixelwar/files/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

volumes:
  app-db-data:
  rabbitmq-data:
  backend-node-modules:
  frontend-node-modules:
  prometheus-data:
  alertmanager-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:
