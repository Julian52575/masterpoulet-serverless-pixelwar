name: Terraform Deploy Runner
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan only shows changes in the job summary; apply also deploys them"
        type: choice
        options: [plan, apply]
        default: plan
      environment:
        description: "Environment(s) to deploy; both runs dev before prod"
        type: choice
        options: [dev, prod, both]
        default: dev
      allow_destroy:
        description: "Allow apply to delete or replace resources"
        type: boolean
        default: false
      ref:
        description: "Tag, branch or commit SHA to deploy (empty: the branch selected above)"
        type: string
        required: false
  push:
    branches: [15-feature-self-run-terraform-related-workflows-checks]
    paths:
      - infra/runners/**
      - scripts/arc_bootstrap.py
      - .github/workflows/terraform-deploy-runner.yml
permissions:
  contents: read
run-name: "Terraform Deploy Runner ${{ inputs.mode || 'plan' }} ${{ inputs.environment || 'dev' }} @ ${{ inputs.ref || github.ref_name }}"
concurrency:
  group: terraform-deploy-runner
  cancel-in-progress: false
jobs:
  # Turns the environment input into the list of environments the deploy job iterates over.
  legs:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.build.outputs.envs }}
    steps:
      # Expand "both" to [dev, prod]; reject anything unknown.
      - id: build
        env:
          ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          case "$ENVIRONMENT" in
            both) envs='["dev","prod"]' ;;
            dev | prod) envs=$(jq -nc --arg e "$ENVIRONMENT" '[$e]') ;;
            *) echo "::error::unknown environment $ENVIRONMENT"; exit 1 ;;
          esac
          echo "envs=$envs" >> "$GITHUB_OUTPUT"

  # Plans and optionally applies the runner infra, one environment at a time (dev before prod).
  # Hosted on purpose: the self-hosted runners are what this deploys.
  deploy:
    needs: legs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      matrix:
        env: ${{ fromJSON(needs.legs.outputs.envs) }}
    name: deploy runners (${{ matrix.env }})
    permissions:
      contents: read
      id-token: write # workload identity federation
    environment: ${{ matrix.env }}
    env:
      MODE: ${{ inputs.mode || 'plan' }} # pushes only plan
      TF_ENV: ${{ matrix.env }}
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
        working-directory: infra/runners
    steps:
      # Check out the requested ref (default: the triggering branch).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Install the nix dev shell with the pinned tooling (terraform, gcloud, kubectl...).
      - uses: ./.github/actions/setup-devshell # zizmor: ignore[self-repository] -- actionlint rejects `$/`
        with:
          warm: "false"
      # Authenticate to GCP through workload identity federation (no stored keys).
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      # gke-gcloud-auth-plugin (run by kubectl) needs an active gcloud account, which the credentials file alone doesn't give.
      - name: Activate gcloud account
        run: gcloud auth login --cred-file="$GOOGLE_GHA_CREDS_PATH" --quiet

      # Plan only needs cluster access to read state, so skip creating the namespace and secret.
      - name: Kubeconfig only (plan)
        if: env.MODE == 'plan'
        run: ../../scripts/arc_bootstrap.py "$TF_ENV" --credentials-only

      # Apply also creates the namespace and the GitHub PAT secret the controller needs.
      - name: Kubeconfig, namespace and secret (apply)
        if: env.MODE == 'apply'
        env:
          GITHUB_PAT: ${{ secrets.ARC_GITHUB_PAT }}
        run: ../../scripts/arc_bootstrap.py "$TF_ENV"

      # Initialise terraform with the environment's remote state backend.
      - run: terraform init -input=false -backend-config="backends/${TF_ENV}.hcl"
      # Compute the plan and publish it in the job summary; the saved plan is what apply runs.
      - name: Plan
        run: |
          terraform plan -input=false -no-color -var-file="${TF_ENV}.tfvars" -out=tfplan
          {
            echo "## Terraform Deploy Runner ${MODE}: ${TF_ENV}"
            echo "Ref \`${GITHUB_REF_NAME}\` at \`$(git rev-parse HEAD)\`"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Fail an apply whose plan deletes or replaces resources unless allow_destroy is set.
      - name: Destroy guard
        env:
          ALLOW_DESTROY: ${{ inputs.allow_destroy || false }}
        run: |
          destroyed=$(terraform show -json tfplan \
            | jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | .address')
          [ -z "$destroyed" ] && exit 0
          {
            echo "### Resources to delete or replace"
            echo '```'
            echo "$destroyed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = apply ] && [ "$ALLOW_DESTROY" != true ]; then
            echo "::error::Plan deletes resources; rerun with allow_destroy to proceed:"
            echo "$destroyed"
            exit 1
          fi
          echo "::warning::Plan deletes resources:"
          echo "$destroyed"
      # Apply exactly the saved plan.
      - name: Apply
        if: env.MODE == 'apply'
        run: terraform apply -input=false -auto-approve tfplan
