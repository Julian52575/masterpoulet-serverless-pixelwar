# .github/workflows/terraform-destroy.yml
name: Terraform Destroy
on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to destroy"
        type: choice
        options: [dev, prod]
        required: true
        default: dev
permissions: {}
jobs:
  select-runner:
    permissions:
      actions: write
    uses: ./.github/workflows/select-runner.yml # zizmor: ignore[self-repository] -- actionlint rejects `$/`
    with:
      environments: ${{ format('["{0}"]', inputs.env) }}

  destroy:
    needs: select-runner
    permissions:
      contents: read
      id-token: write # workload identity federation
    runs-on: ${{ inputs.env == 'prod' && needs.select-runner.outputs.prod || needs.select-runner.outputs.dev }}
    environment: ${{ inputs.env }}
    strategy:
      # Functions first: they depend on foundation.
      max-parallel: 1
      matrix:
        root: [serverless/functions, foundation]
    name: destroy (${{ matrix.root }}, ${{ inputs.env }})
    env:
      # Terraform ignores TF_VAR_* a root does not declare.
      TF_VAR_discord_client_id: ${{ vars.DISCORD_CLIENT_ID }}
      TF_VAR_app_url: ${{ vars.APP_URL }}
      TF_VAR_discord_public_key: ${{ secrets.DISCORD_PUBLIC_KEY }}
      TF_VAR_discord_oauth_client_secret: ${{ secrets.DISCORD_OAUTH_CLIENT_SECRET }}
      TF_VAR_discord_snapshot_webhook: ${{ secrets.DISCORD_SNAPSHOT_WEBHOOK }}
      TF_VAR_discord_bot_token: ${{ secrets.DISCORD_BOT_TOKEN }}
    defaults:
      run:
        working-directory: infra/${{ matrix.root }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - run: terraform init -backend-config=backends/${{ inputs.env }}.hcl
      - run: terraform destroy -auto-approve -var-file=${{ inputs.env }}.tfvars