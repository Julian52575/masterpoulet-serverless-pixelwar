{{- if .Values.ingress.enabled }}
{{- $match := ternary (printf "Host(`%s`) && " .Values.ingress.host) "" (ne .Values.ingress.host "") }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-strip-api
  labels:
    {{- include "pixelwar.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes: [/api]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "pixelwar.labels" . | nindent 4 }}
spec:
  entryPoints: {{- toYaml .Values.ingress.entryPoints | nindent 4 }}
  routes:
    - match: {{ printf "%sPath(`/ws`)" $match | quote }}
      priority: 20
      services:
        - { name: {{ .Release.Name }}-backend, port: 3000 }
    - match: {{ printf "%sPathPrefix(`/api`)" $match | quote }}
      priority: 10
      middlewares:
        - name: {{ .Release.Name }}-strip-api
      services:
        - { name: {{ .Release.Name }}-backend, port: 3000 }
    - match: {{ printf "%sPathPrefix(`/`)" $match | quote }}
      priority: 1
      services:
        - { name: {{ .Release.Name }}-frontend, port: 3000 }
{{- end }}
