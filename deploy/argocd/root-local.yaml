# The only object applied by hand (`just argocd-bootstrap`); Argo CD creates the rest from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Julian52575/serverless-pixelwar.git
    targetRevision: main
    path: deploy/argocd
    helm:
      valueFiles: [envs/local.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
