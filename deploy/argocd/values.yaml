# Desired state of one environment. Each environment overrides this with envs/<env>.yaml,
# selected by its root Application (root-<env>.yaml).

repoURL: https://github.com/Julian52575/masterpoulet-serverless-pixelwar.git
# Branch, tag or commit every child Application tracks. Environments pin what they deploy.
targetRevision: main
env: local
destinationServer: https://kubernetes.default.svc

app:
  namespace: pixelwar
  # Relative to the repository root.
  valueFiles:
    - deploy/k8s/pixelwar/values-local.yaml

# Upstream charts. Keep in sync with deploy/k8s/observability/versions.env (non-GitOps path).
observability:
  namespace: monitoring
  charts:
    kube-prometheus-stack: { repoURL: https://prometheus-community.github.io/helm-charts, version: 92.11.0, wave: 0 }
    traefik: { repoURL: https://traefik.github.io/charts, version: 42.1.3, wave: 1, namespace: traefik }
    loki: { repoURL: https://grafana.github.io/helm-charts, version: 7.5.0, wave: 1 }
    tempo: { repoURL: https://grafana.github.io/helm-charts, version: 1.24.4, wave: 1 }
    alloy: { repoURL: https://grafana.github.io/helm-charts, version: 1.14.2, wave: 1 }

syncPolicy:
  automated:
    prune: true
    # Reverts manual changes (kubectl edit/scale) back to what Git declares.
    selfHeal: true
  retry:
    limit: 5
    backoff: { duration: 10s, factor: 2, maxDuration: 3m }
